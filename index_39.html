// PDF.jsのworkerはCDN配信のため、ページのオリジン（GitHub Pages等）から見ると
// クロスオリジンとなり、new Worker(url) がブラウザにブロックされて
// pdfjsLib.getDocument() が永久に応答しなくなる（＝読み込み中のまま固まる）。
// これを避けるため、workerスクリプトを一度fetchしてBlob URL化してから使う。
let _pdfWorkerBlobUrl=null;
const ensurePdfWorker=async()=>{
if(_pdfWorkerBlobUrl)return _pdfWorkerBlobUrl;
const src=pdfjsLib.GlobalWorkerOptions.workerSrc;
try{
const r=await fetch(src);
if(!r.ok)throw new Error("worker fetch failed: "+r.status);
const blob=await r.blob();
_pdfWorkerBlobUrl=URL.createObjectURL(blob);
pdfjsLib.GlobalWorkerOptions.workerSrc=_pdfWorkerBlobUrl;
}catch(e){
console.warn("PDF worker blob化に失敗、CDN直リンクのまま続行します",e);
}
return _pdfWorkerBlobUrl;
};
// PDFの各ページを個別の画像（1ページ=1図面データ）に分解する。
// 1つのPDFに複数枚の図面（配置図・平面図・立面図…）が含まれるケースに対応するため、
// ページ単位で切り出してそれぞれAI自動判別・分析の対象にする。
const pdfToPages=async file=>{
await ensurePdfWorker();
const buf=await file.arrayBuffer();
const pdf=await pdfjsLib.getDocument({data:buf}).promise;
const pages=[];
for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i);
const base=page.getViewport({scale:1});
const scale=Math.min(2.5,2200/Math.max(base.width,base.height));
const vp=page.getViewport({scale});
const canvas=document.createElement("canvas");
canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);
const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
await page.render({canvasContext:ctx,viewport:vp}).promise;
pages.push(canvas.toDataURL("image/png"));
}
return pages;
};

<button className="bt bp" style={{width:"100%",padding:10}} onClick={copyChatwork}>{cwCopied?"✅ コピーしました":"📋 投稿用テキストをコピー（不適合"+ngList().filter(item=>cwSel[item.id]!==false).length+"/"+tNg+"件を含む）"}</button>
</div>}
</div>}

{tab==="projects"&&<div className="fu">
<div className="cd">
<h3 style={{fontSize:13,fontWeight:700,marginBottom:8}}>💾 現在の分析結果を物件として保存</h3>
<div style={{display:"flex",gap:6}}>
<input className="ip" placeholder="物件名（例：田中様邸 新築）" value={projName} onChange={e=>setProjName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveProject();}}/>
<button className="bt bp" style={{flexShrink:0}} disabled={!projName.trim()||savingProj||done===0} onClick={saveProject}>{savingProj?"保存中...":"💾 保存"}</button>
</div>
{done===0&&<div style={{fontSize:10,color:"var(--t3)",marginTop:6}}>※ 📁図面タブで分析結果があると保存できます</div>}
<label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,marginTop:10,cursor:"pointer"}}><input type="checkbox" checked={finalConfirmed} onChange={e=>setFinalConfirmed(e.target.checked)}/><span>有資格者（一級建築士等）による最終確認済み</span></label>
{finalConfirmed&&<input className="ip" placeholder="確認者名・所見（任意）" value={finalNote} onChange={e=>setFinalNote(e.target.value)} style={{marginTop:6}}/>}
{!finalConfirmed&&<div style={{fontSize:10,color:"var(--warn)",marginTop:4}}>※ 未チェックの場合、AI判定のみの保存となります。最終判断は有資格者が行ってください。</div>}
</div>
<div className="cd">
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
<h3 style={{fontSize:13,fontWeight:700}}>📁 保存済み物件履歴</h3>
<button className="bt bs" onClick={fetchProjects}>🔄 更新</button>
</div>
<input className="ip" placeholder="物件名で絞り込み..." value={projFilter} onChange={e=>setProjFilter(e.target.value)} style={{marginBottom:10}}/>
{projLd&&<div style={{textAlign:"center",padding:20}}><div className="sp"/></div>}
{!projLd&&projects.filter(p=>!projFilter||p.name.includes(projFilter)).length===0&&<div style={{textAlign:"center",padding:20,color:"var(--t3)"}}>保存された物件履歴はありません</div>}
{!projLd&&projects.filter(p=>!projFilter||p.name.includes(projFilter)).map(p=><div key={p.id} className="wk" style={{alignItems:"flex-start"}}>
<div style={{flex:1}}>
<div style={{fontSize:13,fontWeight:700}}>{p.name}</div>
<div style={{fontSize:10,color:"var(--t3)",marginTop:2}}>{new Date(p.created_at).toLocaleString("ja-JP")}・{p.staff||"—"}・{p.mode==="chouki"?"🏅長期優良":"📋確認申請"}</div>
<div style={{display:"flex",gap:8,marginTop:4,fontSize:10}}><span style={{color:"var(--ok)"}}>適合{p.summary?.ok??0}</span><span style={{color:"var(--ng)"}}>不適合{p.summary?.ng??0}</span><span style={{color:"var(--warn)"}}>要確認{p.summary?.warn??0}</span><span style={{color:"var(--t3)"}}>{p.summary?.done??0}/{p.summary?.total??0}図面</span></div>
{p.final_check?.confirmed?<div style={{fontSize:10,color:"var(--ok)",marginTop:4}}>✅ 最終確認済み（{p.final_check.by}・{new Date(p.final_check.at).toLocaleDateString("ja-JP")}）{p.final_check.note&&<div style={{color:"var(--t3)"}}>{p.final_check.note}</div>}</div>:<div style={{fontSize:10,color:"var(--warn)",marginTop:4}}>⚠ 有資格者による最終確認 未実施</div>}
</div>
<div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
<button className="bt bs" onClick={()=>loadProject(p)}>📂 開く</button>
{!p.final_check?.confirmed&&<button className="bt bs" style={{color:"var(--ok)"}} onClick={()=>confirmProject(p.id)}>✔ 最終確認</button>}
<button className="bt bs" onClick={()=>deleteProject(p.id)}>🗑</button>
</div>
</div>)}
</div>
</div>}

{tab==="study"&&<div className="fu">
<div className="cd" style={{background:"linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.06))",borderColor:"rgba(99,102,241,.25)"}}>
<div style={{display:"flex",alignItems:"center",gap:12}}>
<div style={{fontSize:28}}>{levelTitle(levelOf(progress.xp)).split(" ")[0]}</div>
<div style={{flex:1}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",flexWrap:"wrap",gap:4}}>
<span style={{fontSize:14,fontWeight:700}}>👤{staff}・Lv.{levelOf(progress.xp)} {levelTitle(levelOf(progress.xp)).split(" ").slice(1).join(" ")}</span>
<span style={{fontSize:10,color:"var(--t3)"}}>{progress.xp%XP_PER_LEVEL}/{XP_PER_LEVEL} XP（累計{progress.xp}XP）</span>
</div>
<div className="pb" style={{marginTop:6}}><div className="pf" style={{width:(progress.xp%XP_PER_LEVEL)+"%",background:"linear-gradient(90deg,var(--ac),var(--ac2))"}}/></div>
<div style={{fontSize:10,color:"var(--t2)",marginTop:6}}>クイズ正答率 {progress.quiz_total?Math.round(progress.quiz_correct/progress.quiz_total*100):0}%（{progress.quiz_correct}/{progress.quiz_total}問）</div>
</div>
</div>
</div>
<div className="tabs" style={{marginBottom:10}}>{[{k:"glossary",l:"📖 用語解説"},{k:"quiz",l:"🧠 理解度クイズ"},{k:"weak",l:"📌 弱点管理"}].map(t=><button key={t.k} className={"bt stab "+(studySub===t.k?"ba":"")} onClick={()=>setStudySub(t.k)}>{t.l}</button>)}</div>

{studySub==="glossary"&&<div className="cd fu">
<div style={{fontSize:11,color:"var(--t2)",marginBottom:10,lineHeight:1.7}}>図面種別ごとのチェック項目と、その意味をやさしく解説します。「AI解説」を押すと、趣旨・実務でのよくある間違い・対応ポイントをより詳しく説明します。</div>
<select className="ip" value={studyType} onChange={e=>setStudyType(e.target.value)} style={{marginBottom:12}}>{DW.map(t=><option key={t.id} value={t.id}>{t.icon} {t.label}</option>)}<option value="chouki">🏅 長期優良住宅（追加項目）</option></select>
{(studyType==="chouki"?CH:(DW.find(t=>t.id===studyType)?.checks||[])).map(ck=><div key={ck.id} className="gi"><div style={{display:"flex",alignItems:"flex-start",gap:8}}><div style={{flex:1}}>{ck.cr&&<span style={{fontSize:8,background:"rgba(239,68,68,.15)",color:"var(--ng)",padding:"1px 4px",borderRadius:2,marginRight:4}}>必須</span>}<span style={{fontSize:12,fontWeight:600}}>{ck.tx}</span>{ck.law&&<span style={{fontSize:10,color:"var(--t3)",marginLeft:6}}>{ck.law}</span>}<div style={{fontSize:11,color:"var(--t2)",marginTop:3,lineHeight:1.6}}>{ck.hint}</div>{expl[ck.id]&&<div className="fu" style={{fontSize:11,color:"#a5b4fc",marginTop:6,lineHeight:1.7,whiteSpace:"pre-wrap",background:"rgba(99,102,241,.06)",padding:8,borderRadius:6}}>{expl[ck.id]}</div>}</div><button className="bt bs" disabled={explLd[ck.id]} onClick={()=>explainItem(ck,null)}>{explLd[ck.id]?<div className="sp" style={{width:12,height:12,borderWidth:2}}/>:(expl[ck.id]?"再取得":"🤖 AI解説")}</button></div></div>)}
</div>}

{studySub==="quiz"&&<div className="cd fu">
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><span style={{fontSize:12,color:"var(--t2)"}}>正答率（正解+10XP・不正解+3XP）</span><span style={{fontSize:14,fontWeight:700,color:"var(--ac)"}}>{progress.quiz_total?Math.round(progress.quiz_correct/progress.quiz_total*100):0}%（{progress.quiz_correct}/{progress.quiz_total}問）</span></div>
{!quiz&&!quizLd&&<button className="bt bp" style={{width:"100%",padding:12}} onClick={genQuiz}>🎲 問題を出題する</button>}
{quizLd&&<div style={{textAlign:"center",padding:24}}><div className="sp"/></div>}
{quiz&&<div className="fu">
<div style={{fontSize:10,color:"var(--t3)",marginBottom:4}}>出題元：{quiz.srcTx}</div>
<div style={{fontSize:13,fontWeight:600,marginBottom:12,lineHeight:1.7}}>{quiz.question}</div>
{quiz.options.map((o,i)=><button key={i} className={"qo "+(quiz.sel!=null?(i===quiz.answer?"qc":(i===quiz.sel?"qw":"")):"")} disabled={quiz.sel!=null} onClick={()=>answerQuiz(i)}>{String.fromCharCode(65+i)}. {o}</button>)}
{quiz.sel!=null&&<><div className="fu" style={{fontSize:12,marginTop:8,padding:10,background:"rgba(99,102,241,.06)",borderRadius:8,lineHeight:1.7}}>{quiz.sel===quiz.answer?"✅ 正解！":"❌ 不正解"}　{quiz.explain}</div><button className="bt bp" style={{width:"100%",padding:10,marginTop:10}} onClick={genQuiz}>次の問題へ →</button></>}
</div>}
</div>}

{studySub==="weak"&&<div className="cd fu">
<div style={{fontSize:11,color:"var(--t2)",marginBottom:10,lineHeight:1.7}}>図面分析でNG・要確認になった項目や、クイズで間違えた項目を自動で記録しています。頻度が高い項目ほど重点的に復習しましょう。</div>
{Object.keys(progress.weak||{}).length===0&&<div style={{textAlign:"center",padding:20,color:"var(--t3)"}}>まだ記録がありません</div>}
{Object.values(progress.weak||{}).sort((a,b)=>(b.ng+b.warn+b.quiz)-(a.ng+a.warn+a.quiz)).map(w=><div key={w.id} className="wk"><div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{w.tx}</div><div style={{fontSize:10,color:"var(--t3)"}}>{w.dwLabel}{w.law?"・"+w.law:""}</div></div><div style={{textAlign:"right",fontSize:10}}>{w.ng>0&&<div style={{color:"var(--ng)"}}>NG×{w.ng}</div>}{w.warn>0&&<div style={{color:"var(--warn)"}}>要確認×{w.warn}</div>}{w.quiz>0&&<div style={{color:"var(--t2)"}}>クイズ誤答×{w.quiz}</div>}</div></div>)}
{Object.keys(progress.weak||{}).length>0&&<button className="bt bs" style={{marginTop:10}} onClick={clearWeak}>🗑 記録をクリア</button>}
</div>}
</div>}

</>}
<div style={{textAlign:"center",padding:"20px 0",fontSize:10,color:"var(--t3)"}}>Powered by ハゼモト建設株式会社</div>
</main>
{ok&&cOn&&<div className="cp"><div className="ch"><span style={{fontSize:18}}>💬</span><div style={{flex:1,fontSize:13,fontWeight:600,color:"#a5b4fc"}}>AI相談</div><button className="bi" onClick={()=>setCOn(false)}>✕</button></div><div className="cb">{cM.map((m,i)=><div key={i} style={{display:"flex",justifyContent:m.r==="u"?"flex-end":"flex-start"}}><div className={"cm "+(m.r==="u"?"u":"a")}>{m.t}</div></div>)}{cL&&<div style={{textAlign:"center",fontSize:11,color:"var(--ac)"}}>分析中...</div>}<div ref={cE}/></div><div className="ci"><input className="ip" value={cI} onChange={e=>setCI(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendC()}}} placeholder="質問を入力..." style={{fontSize:12}}/><button className="bt bp" disabled={cL} onClick={sendC} style={{flexShrink:0}}>送信</button></div></div>}
{ok&&!cOn&&<button className="fab" onClick={()=>{setCM([{r:"a",t:"建築基準法（2025年改正版）について質問をどうぞ。"}]);setCOn(true)}}>💬</button>}
</div>)}
ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script></body></html>
