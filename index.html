// PDF.jsのworkerはCDN配信のため、ページのオリジン（GitHub Pages等）から見ると
// クロスオリジンとなり、new Worker(url) がブラウザにブロックされて
// pdfjsLib.getDocument() が永久に応答しなくなる（＝読み込み中のまま固まる）。
// これを避けるため、workerスクリプトを一度fetchしてBlob URL化してから使う。
let _pdfWorkerBlobUrl=null;
const ensurePdfWorker=async()=>{
if(_pdfWorkerBlobUrl)return _pdfWorkerBlobUrl;
const src=pdfjsLib.GlobalWorkerOptions.workerSrc;
try{
const r=await fetch(src);
if(!r.ok)throw new Error("worker fetch failed: "+r.status);
const blob=await r.blob();
_pdfWorkerBlobUrl=URL.createObjectURL(blob);
pdfjsLib.GlobalWorkerOptions.workerSrc=_pdfWorkerBlobUrl;
}catch(e){
console.warn("PDF worker blob化に失敗、CDN直リンクのまま続行します",e);
}
return _pdfWorkerBlobUrl;
};
// PDFの各ページを個別の画像（1ページ=1図面データ）に分解する。
// 1つのPDFに複数枚の図面（配置図・平面図・立面図…）が含まれるケースに対応するため、
// ページ単位で切り出してそれぞれAI自動判別・分析の対象にする。
const pdfToPages=async file=>{
await ensurePdfWorker();
const buf=await file.arrayBuffer();
const pdf=await pdfjsLib.getDocument({data:buf}).promise;
const pages=[];
for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i);
const base=page.getViewport({scale:1});
const scale=Math.min(2.5,2200/Math.max(base.width,base.height));
const vp=page.getViewport({scale});
const canvas=document.createElement("canvas");
canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);
const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
await page.render({canvasContext:ctx,viewport:vp}).promise;
pages.push(canvas.toDataURL("image/png"));
}
return pages;
};

const detect=async dw=>{const b=dw.data.split(",")[1];const mt=dw.data.slice(0,30).includes("pdf")?"application/pdf":dw.data.slice(0,30).includes("png")?"image/png":"image/jpeg";const r=await api([{role:"user",content:[{type:mt==="application/pdf"?"document":"image",source:{type:"base64",media_type:mt,data:b}},{type:"text",text:"この図面の種別を判定。以下からIDのみ返して:\n"+DW.map(t=>t.id+":"+t.label).join(", ")+"\n判定不能ならunknown"}]}],100);return DW.find(t=>r.trim().includes(t.id))?.id||"";};

他1.5／隣地斜線:住居系20m+1.25・その他31m+2.5等）。用途地域が読み取れない場合は「用途地域の確認が必要」としてstatusをwarnにする。\n16. 案件条件や図面の記載（用途地域・防火指定等）から、その規定自体がこの案件に適用されない項目はstatusをnaとし、detailに理由を「（理由）のため該当なし」の形で必ず記載すること（例:「防火・準防火地域および法22条区域の指定がないため延焼のおそれのある部分の防火措置は不要」）。適用の有無が案件条件からも判断できない場合はnaにせずwarnとし、確認方法をactionに記載する。\n17. key_factsに、この図面に記載されている大臣認定番号・型式認定番号（例:PC030BE-0000）と、図面間整合の確認に重要な数値・仕様（延べ面積、最高高さ、UA値、耐力壁仕様等。最大8件）を抽出して記載すること。記載がなければ空配列にする。\nJSON形式のみ。バッククォート不要。\n"+'{"drawing_type":"'+dt.label+'","summary":"所見50字","items":[{"id":"ID","status":"ok/ng/warn/na","detail":"所見（該当する場合は根拠条文を含む、80字程度）","law_note":"引用条文の平易な説明（50字程度、条文引用なしの場合は空文字）","action":"具体的な作業指示（ng/warnは必須・100字程度、okは空文字）","confidence":0.0-1.0}],"key_facts":{"cert_numbers":["記載されている認定番号（なければ空配列）"],"key_values":["整合確認に重要な数値・仕様（例:延べ面積98.53㎡）最大8件"]}}'}]}],8000);

</div>}
</div>}

{retryTarget>0&&<button className="bt bs bp" onClick={()=>{setTab("upload");batchAll();}}>🚀 今すぐ分析する（{retryTarget}件）</button>}
</div>}
{noData.length>0&&<div style={{marginBottom:10,fontSize:11,color:"var(--warn)",lineHeight:1.7}}>⚠️ 画像が添付されていない図面が{noData.length}件あります（下書き復元時など）。図面タブの各項目にある「📎再添付」ボタンから画像を選び直してください。</div>}
{unclassified.length>0&&<div style={{marginBottom:10,fontSize:11,color:"var(--t2)",lineHeight:1.7}}>🔍 種別未定の図面が{unclassified.length}件あります。図面タブの🔍ボタンでAIが自動判別するか、表紙・仕様書など8種類に当てはまらない場合は「🚫対象外」ボタンで分析対象から外せます</div>}

{notUploaded.length>0&&<div style={{marginBottom:10}}>
<h3 style={{fontSize:12,fontWeight:600,marginBottom:6,color:"var(--t2)"}}>📎 未提出の図面</h3>
<div style={{display:"flex",flexWrap:"wrap",gap:5}}>{notUploaded.map(t=><span key={t.id} style={{fontSize:10,color:"var(--t3)",background:"rgba(30,41,59,.5)",padding:"3px 8px",borderRadius:4}}>{t.icon} {t.label}</span>)}</div>
</div>}
<label className="bt bs bp" style={{cursor:"pointer",display:"inline-block"}}>📎 ここから図面を追加でアップロード<input type="file" accept="image/*,.pdf" multiple style={{display:"none"}} onChange={e=>{addF(e.target.files);e.target.value=""}}/></label>

})()}

</div>}
