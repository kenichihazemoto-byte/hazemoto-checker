<style>

const {useState,useRef,useEffect}=React;
/* ★★★ APIキーを貼り付け ★★★ */
const API_KEY="const API_KEY="YOUR_API_KEY_HERE";
/* ═══════════════════════════ */
const DW_TYPES=[
{id:"haichi",label:"配置図",icon:"🗺️",color:"#0ea5e9",checks:[{id:"h01",tx:"方位（真北）の表示",cr:true,law:"施行規則1条の3"},{id:"h02",tx:"境界線名の記載",cr:true,law:"施行規則1条の3"},{id:"h03",tx:"敷地内の建築物の位置",cr:true,law:"法52条"},{id:"h04",tx:"道路種別・道路幅員",cr:true,law:"法42条"},{id:"h05",tx:"地盤レベル",cr:true,law:"施行令2条"},{id:"h06",tx:"建築物の高さ",cr:true,law:"法56条"},{id:"h07",tx:"排水経路",cr:true,law:"法36条"},{id:"h08",tx:"延焼のおそれのある部分",cr:true,law:"法2条六号"},{id:"h09",tx:"用途地域・防火地域の境界線",cr:true,law:"法48条,61条"},{id:"h10",tx:"斜線検討距離",cr:true,law:"法56条"},{id:"h11",tx:"敷地面積・建蔽率・容積率",cr:true,law:"法52条,53条"},{id:"h12",tx:"擁壁・外壁後退",cr:false,law:"法19条,54条"}]},
{id:"heimen",label:"平面図",icon:"📐",color:"#10b981",checks:[{id:"p01",tx:"方位（真北）",cr:true,law:"施行規則1条の3"},{id:"p02",tx:"各室の用途・面積",cr:true,law:"施行規則1条の3"},{id:"p03",tx:"壁厚・柱位置・通り芯",cr:true,law:"法20条"},{id:"p04",tx:"開口部の位置・寸法",cr:true,law:"法28条"},{id:"p05",tx:"耐力壁の位置・種類",cr:true,law:"令46条"},{id:"p06",tx:"階段の幅・蹴上・踏面",cr:true,law:"令23条"},{id:"p07",tx:"給気口・換気設備",cr:true,law:"令20条の2"},{id:"p08",tx:"防火区画貫通部",cr:true,law:"令112条"},{id:"p09",tx:"内装制限の表示",cr:true,law:"法35条の2"},{id:"p10",tx:"住宅用火災警報器",cr:true,law:"法9条の2"},{id:"p11",tx:"バリアフリー対応",cr:false,law:"住宅性能表示"}]},
{id:"ritsumen",label:"立面図",icon:"🏢",color:"#8b5cf6",checks:[{id:"r01",tx:"外壁の仕様",cr:true,law:"施行規則1条の3"},{id:"r02",tx:"屋根の仕様・勾配",cr:true,law:"施行規則1条の3"},{id:"r03",tx:"軒裏の仕様",cr:true,law:"施行規則1条の3"},{id:"r04",tx:"最高高さ・軒高",cr:true,law:"令2条"},{id:"r05",tx:"地盤面の表示",cr:true,law:"令2条"},{id:"r06",tx:"斜線制限の検討線",cr:true,law:"法56条"},{id:"r07",tx:"敷地境界線",cr:true,law:"施行規則1条の3"},{id:"r08",tx:"採光検討距離",cr:true,law:"法28条"},{id:"r09",tx:"軒の出・屋根勾配",cr:true,law:"令2条"},{id:"r10",tx:"給排気口の位置",cr:true,law:"令20条の3"}]},
{id:"danmen",label:"断面図",icon:"📏",color:"#f59e0b",checks:[{id:"d01",tx:"地盤面",cr:true,law:"令2条"},{id:"d02",tx:"天井高さ(≧2100mm)",cr:true,law:"令21条"},{id:"d03",tx:"床高さ(≧450mm/木造)",cr:true,law:"令22条"},{id:"d04",tx:"横架材間内法長さ",cr:true,law:"令43条"},{id:"d05",tx:"軒の出寸法",cr:true,law:"施行規則1条の3"},{id:"d06",tx:"屋根ふき材・外装材",cr:true,law:"施行規則1条の3"},{id:"d07",tx:"階段の構造",cr:true,law:"令23条"},{id:"d08",tx:"断熱材の仕様",cr:false,law:"省エネ法"},{id:"d09",tx:"防湿方法",cr:true,law:"令22条"}]},
{id:"kanazuchi",label:"矩計図",icon:"📊",color:"#ec4899",checks:[{id:"k01",tx:"基礎の構造・配筋",cr:true,law:"令38条"},{id:"k02",tx:"土台・アンカーボルト",cr:true,law:"令42条"},{id:"k03",tx:"軸組の構造方法",cr:true,law:"令43条"},{id:"k04",tx:"屋根の断面構造",cr:true,law:"施行規則1条の3"},{id:"k05",tx:"外壁の通気構造",cr:false,law:"住宅性能表示"},{id:"k06",tx:"断熱仕様",cr:false,law:"省エネ法"},{id:"k07",tx:"基礎高さ(≧400mm)",cr:false,law:"住宅性能表示"}]},
{id:"kiso",label:"基礎伏図",icon:"🧱",color:"#64748b",checks:[{id:"b01",tx:"基礎の形状・配筋",cr:true,law:"令38条"},{id:"b02",tx:"アンカーボルトの位置",cr:true,law:"告示1460号"},{id:"b03",tx:"換気口・基礎パッキン",cr:true,law:"令22条"},{id:"b04",tx:"人通口の位置・補強",cr:false}]},
{id:"hekiwall",label:"壁量計算書",icon:"📋",color:"#dc2626",checks:[{id:"w01",tx:"各階床面積",cr:true,law:"令46条"},{id:"w02",tx:"必要壁量の算定",cr:true,law:"令46条(2025改正)"},{id:"w03",tx:"存在壁量の算定",cr:true,law:"令46条"},{id:"w04",tx:"壁量判定(充足率≧1.0)",cr:true,law:"令46条"},{id:"w05",tx:"四分割法(壁率比≧0.5)",cr:true,law:"令46条"},{id:"w06",tx:"N値計算・接合金物",cr:true,law:"告示1460号"}]},
{id:"energy",label:"省エネ計算書",icon:"🌱",color:"#22c55e",checks:[{id:"e01",tx:"UA値",cr:true,law:"省エネ法"},{id:"e02",tx:"ηAC値",cr:true,law:"省エネ法"},{id:"e03",tx:"BEI(≦1.0)",cr:true,law:"省エネ法"},{id:"e04",tx:"断熱仕様の整合性",cr:true,law:"省エネ法"}]},
];
const CHOUKI=[{id:"ch01",tx:"耐震等級2以上",cr:true,cat:"構造"},{id:"ch02",tx:"劣化対策等級3",cr:true,cat:"劣化"},{id:"ch03",tx:"床下空間330mm以上",cr:true,cat:"劣化"},{id:"ch04",tx:"維持管理対策等級3",cr:true,cat:"維持管理"},{id:"ch05",tx:"省エネ等級4以上",cr:true,cat:"温熱"},{id:"ch06",tx:"居住面積75㎡以上",cr:true,cat:"面積"},{id:"ch07",tx:"維持保全計画",cr:true,cat:"維持"}];

const callAPI=async(msgs,mt=4000)=>{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:mt,messages:msgs})});if(!r.ok)throw new Error("API Error "+r.status);const d=await r.json();return d.content?.map(c=>c.text||"").join("")||"";};

const guessType=n=>{const l=n.toLowerCase();if(/配置/.test(l))return"haichi";if(/平面/.test(l)&&!/詳細/.test(l))return"heimen";if(/立面/.test(l))return"ritsumen";if(/断面/.test(l))return"danmen";if(/矩計/.test(l))return"kanazuchi";if(/基礎伏|基礎/.test(l))return"kiso";if(/壁量|耐力壁/.test(l))return"hekiwall";if(/省エネ|外皮|ua/.test(l))return"energy";return"";};

function App(){
const ok=API_KEY&&API_KEY!=="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";
const[mode,setMode]=useState("kakunin");const[dws,setDws]=useState([]);const[act,setAct]=useState(null);const[res,setRes]=useState({});const[chRes,setChRes]=useState({});const[tab,setTab]=useState("upload");const[chatOn,setChatOn]=useState(false);const[chatM,setChatM]=useState([]);const[chatI,setChatI]=useState("");const[chatL,setChatL]=useState(false);const[batch,setBatch]=useState("");const[batchR,setBatchR]=useState(false);const fRef=useRef(null);const cEnd=useRef(null);const[drag,setDrag]=useState(false);
useEffect(()=>{cEnd.current?.scrollIntoView({behavior:"smooth"});},[chatM]);

const addF=f=>{Array.from(f).forEach(file=>{const r=new FileReader();r.onload=ev=>{const id="d"+Date.now()+Math.random().toString(36).slice(2,4);const g=guessType(file.name);setDws(p=>[...p,{id,name:file.name,type:g,data:ev.target.result,res:null,ld:false,auto:!!g}]);};r.readAsDataURL(file);});};

const detect=async dw=>{const b=dw.data.split(",")[1];const mt=dw.data.includes("pdf")?"application/pdf":dw.data.includes("png")?"image/png":"image/jpeg";const r=await callAPI([{role:"user",content:[{type:mt==="application/pdf"?"document":"image",source:{type:"base64",media_type:mt,data:b}},{type:"text",text:"この図面の種別を判定。以下からIDのみ返して:\n"+DW_TYPES.map(t=>t.id+":"+t.label).join(", ")+"\n判定不能なら unknown"}]}],100);const c=r.trim().replace(/["`']/g,"");return DW_TYPES.find(t=>c.includes(t.id))?.id||"";};

const analyze=async dw=>{if(!ok)return;let tid=dw.type;
setDws(p=>p.map(d=>d.id===dw.id?{...d,ld:true}:d));
if(!tid){setBatch("🔍 "+dw.name+" の種別を判別中...");try{tid=await detect(dw);if(tid)setDws(p=>p.map(d=>d.id===dw.id?{...d,type:tid,auto:true}:d));else{setDws(p=>p.map(d=>d.id===dw.id?{...d,ld:false}:d));setBatch("⚠️ "+dw.name+" の種別不明。手動選択してください");return;}}catch(e){setDws(p=>p.map(d=>d.id===dw.id?{...d,ld:false}:d));return;}}
const dt=DW_TYPES.find(t=>t.id===tid);if(!dt){setDws(p=>p.map(d=>d.id===dw.id?{...d,ld:false}:d));return;}
setBatch("📋 "+dw.name+"（"+dt.label+"）を分析中...");
const cp=dt.checks.map(c=>"- ["+c.id+"] "+c.tx+"（"+(c.cr?"必須":"推奨")+"）"+(c.law||"")).join("\n");
const chP=mode==="chouki"?"\n\n【長期優良 追加】\n"+CHOUKI.map(c=>"- ["+c.id+"] "+c.tx+"（"+c.cat+"）").join("\n"):"";
const sp="一級建築士として2025年4月改正建築基準法に基づき判定。\n\n【"+dt.label+"】\n"+cp+chP+'\n\nJSON形式のみ。バッククォート不要。\n{"drawing_type":"'+dt.label+'","summary":"所見50字以内","items":[{"id":"ID","status":"ok/ng/warn/na","detail":"具体的所見","confidence":0.0-1.0}]}';
try{const b64=dw.data.split(",")[1];const mt=dw.data.includes("pdf")?"application/pdf":dw.data.includes("png")?"image/png":"image/jpeg";
const raw=await callAPI([{role:"user",content:[{type:mt==="application/pdf"?"document":"image",source:{type:"base64",media_type:mt,data:b64}},{type:"text",text:sp}]}]);
let p;try{p=JSON.parse(raw.replace(/```json|```/g,"").trim());}catch{p={summary:"解析失敗",items:[]};}
if(p.items){const nr={...res};p.items.forEach(i=>{nr[i.id]={...i,dwId:dw.id,dwN:dw.name};});setRes(nr);
if(mode==="chouki"){const nc={...chRes};p.items.filter(i=>i.id.startsWith("ch")).forEach(i=>{nc[i.id]={...i};});setChRes(nc);}}
setDws(pr=>pr.map(d=>d.id===dw.id?{...d,ld:false,res:p,type:tid}:d));setAct(dw.id);
}catch(e){setDws(pr=>pr.map(d=>d.id===dw.id?{...d,ld:false,res:{summary:"Error: "+e.message,items:[]}}:d));}};

const batchAll=async()=>{const tg=dws.filter(d=>!d.res&&!d.ld);if(!tg.length)return;setBatchR(true);setTab("results");
for(let i=0;i<tg.length;i++){setBatch((i+1)+"/"+tg.length+" 分析中: "+tg[i].name);await analyze(tg[i]);if(i<tg.length-1)await new Promise(r=>setTimeout(r,1000));}
setBatch("");setBatchR(false);};

const sendC=async()=>{if(!chatI.trim()||chatL||!ok)return;const m=chatI.trim();setChatI("");setChatM(p=>[...p,{r:"user",t:m}]);setChatL(true);
const cx=act?dws.find(d=>d.id===act):null;const ci=cx?.res?"\n図面:"+cx.name+"\n結果:"+JSON.stringify(cx.res.items?.slice(0,8)):"";
try{const t=await callAPI([...chatM.slice(-6).map(x=>({role:x.r==="user"?"user":"assistant",content:x.t})),{role:"user",content:"建築基準法(2025年改正版)専門家として具体的数値で回答。"+ci+"\n\n"+m}],1500);setChatM(p=>[...p,{r:"ai",t}]);}catch(e){setChatM(p=>[...p,{r:"ai",t:"Error: "+e.message}]);}setChatL(false);};

const tOk=Object.values(res).filter(r=>r.status==="ok"&&!r.id?.startsWith("ch")).length;
const tNg=Object.values(res).filter(r=>r.status==="ng"&&!r.id?.startsWith("ch")).length;

{!ok&&<div className="card" style={{borderColor:"rgba(239,68,68,.3)",background:"rgba(239,68,68,.06)",textAlign:"center",padding:24}}><div style={{fontSize:24,marginBottom:8}}>⚠️</div><div style={{fontSize:14,fontWeight:600,color:"#f87171"}}>APIキー未設定</div><div style={{fontSize:12,color:"var(--text2)"}}>管理者がindex.html内のAPI_KEYを設定してください</div></div>}

{ok&&<>

{tab==="upload"&&<>

<div style={{display:"flex",gap:4,flexShrink:0,alignItems:"center"}}>

{done>0&&done===dws.length&&<div className="card card-ok fade-up" style={{textAlign:"center",padding:16,marginTop:8}}><div style={{fontSize:20,marginBottom:4}}>✅</div><div style={{fontSize:13,fontWeight:600,color:"var(--ok)"}}>全{dws.length}図面の分析完了</div><button className="btn btn-sm" style={{marginTop:8}} onClick={()=>setTab("summary")}>📊 総合判定を見る</button></div>}
</div>}
</>}

{tab==="results"&&<>
{done>1&&<div style={{display:"flex",gap:4,marginBottom:10,overflowX:"auto",paddingBottom:4}}>{dws.filter(d=>d.res).map(d=>{const t=DW_TYPES.find(x=>x.id===d.type);const ng=d.res?.items?.filter(i=>i.status==="ng").length||0;return <button key={d.id} className={"btn btn-sm "+(act===d.id?"btn-active":"")} onClick={()=>setAct(d.id)} style={{whiteSpace:"nowrap",position:"relative"}}>{t?.icon} {t?.label}{ng>0&&<span className="badge">{ng}</span>}</button>})}</div>}
{(()=>{const dw=dws.find(d=>d.id===act);if(!dw?.res)return<div style={{textAlign:"center",padding:40,color:"var(--text3)"}}>📁図面タブからアップロード・分析してください</div>;const dt=DW_TYPES.find(t=>t.id===dw.type);return(
<div className="card fade-up" style={{borderColor:(dt?.color||"")+"33"}}>
<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span style={{fontSize:22}}>{dt?.icon}</span><div><div style={{fontSize:14,fontWeight:700,color:dt?.color}}>{dt?.label}</div><div style={{fontSize:10,color:"var(--text3)"}}>{dw.name}</div></div><div style={{marginLeft:"auto",fontSize:11,color:"var(--text2)",background:"rgba(15,23,42,.5)",padding:"4px 8px",borderRadius:6,maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{dw.res.summary}</div></div>
{dw.res.items?.map(item=>{const ck=dt?.checks?.find(c=>c.id===item.id)||CHOUKI.find(c=>c.id===item.id);return(
<div key={item.id} className={"result-item "+item.status}>
<div className={"status-icon "+item.status}>{sI(item.status)}</div>
<div style={{flex:1}}><div style={{fontSize:12,fontWeight:500,lineHeight:1.5}}>{ck?.cr&&<span style={{fontSize:8,background:"rgba(239,68,68,.15)",color:"var(--ng)",padding:"1px 4px",borderRadius:2,marginRight:4}}>必須</span>}{ck?.tx||item.id}</div>
{item.detail&&<div style={{fontSize:11,color:"var(--text2)",marginTop:2,lineHeight:1.5}}>{item.detail}</div>}
{item.confidence!=null&&<div style={{display:"flex",alignItems:"center",gap:4,marginTop:3}}><span style={{fontSize:8,color:"var(--text3)"}}>確信度</span><div style={{width:50,height:2,background:"rgba(148,163,184,.1)",borderRadius:1,overflow:"hidden"}}><div style={{width:(item.confidence||0)*100+"%",height:2,background:item.confidence>.7?"var(--ok)":item.confidence>.4?"var(--warn)":"var(--ng)",borderRadius:1}}/></div><span style={{fontSize:8,color:"var(--text3)"}}>{Math.round((item.confidence||0)*100)}%</span></div>}
</div>
<button className="btn-icon" style={{fontSize:12}} onClick={()=>{setChatM([{r:"ai",t:"「"+(ck?.tx||item.id)+"」について質問をどうぞ。\n判定: "+(item.status==="ok"?"適合":item.status==="ng"?"不適合":"要確認")+"\n所見: "+(item.detail||"なし")}]);setChatOn(true)}}>💬</button>
</div>)})}
</div>)})()}
</>}

{tab==="summary"&&<div className="fade-up">

{DW_TYPES.map(dt=>{const ds=dws.filter(d=>d.type===dt.id&&d.res);if(!ds.length)return null;const items=ds.flatMap(d=>d.res?.items||[]);const o=items.filter(i=>i.status==="ok").length,n=items.filter(i=>i.status==="ng").length;const p=items.length?Math.round(o/items.length*100):0;return(
<div key={dt.id} className="progress-row"><span style={{fontSize:18}}>{dt.icon}</span><div style={{flex:1}}><div style={{fontSize:12,fontWeight:500}}>{dt.label}</div><div className="progress-bar"><div className="progress-fill" style={{width:p+"%",background:n>0?"var(--ng)":p===100?"var(--ok)":"var(--accent)"}}/></div></div><div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:13,fontWeight:700}}>{p}%</div><div style={{fontSize:9,color:"var(--text3)"}}>{n>0&&<span style={{color:"#f87171"}}>NG:{n} </span>}{o}/{items.length}</div></div></div>)})}

{(()=>{const ck=new Set(dws.filter(d=>d.res).map(d=>d.type));const uc=DW_TYPES.filter(t=>!ck.has(t.id));return uc.length?<div className="card"><h3 style={{fontSize:12,fontWeight:600,marginBottom:6,color:"var(--text2)"}}>📎 未提出の図面</h3><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{uc.map(t=><span key={t.id} style={{fontSize:10,color:"var(--text3)",background:"rgba(30,41,59,.5)",padding:"3px 8px",borderRadius:4}}>{t.icon} {t.label}</span>)}</div></div>:null})()}

</div>}
